name: CI

# Pull requests run it here; pushes to main run it through pages.yml before publishing.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vendored sql.js matches package.json
        run: npm run vendor -- --check
      - name: Parity with the Ruby dashboard, WAL reader
        run: npm test

  e2e:
    name: Browser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live, detail, file and error paths against the mock API
        run: npm run e2e
